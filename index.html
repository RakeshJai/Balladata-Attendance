<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Baladatta Tamil School Attendance</title>
  <meta name="description" content="Attendance portal for Baladatta Tamil School." />

  <!-- Google Identity Services & GAPI Client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#120f0a">
  <link rel="icon" type="image/png" href="Logo.png">

  <!-- Flat Neoclassical Theme (v18) -->
  <link rel="stylesheet" href="css/styles.css?v=18">
</head>

<body>
  <!-- Traditional Architectural Backdrop Layers -->
  <div class="bg-watermark-left" aria-hidden="true"></div>
  <div class="bg-watermark-right" aria-hidden="true"></div>
  <div class="bg-architectural-center" aria-hidden="true"></div>

  <!-- Offline Notice -->
  <div id="offlineBanner" class="offline-banner">
    Offline Mode: Changes saved locally and will sync when reconnected.
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-section">
        <div class="brand-emblem" id="headerAvatar">
          <img src="Logo.png" alt="Baladatta Emblem" onerror="this.outerHTML='<span class=\'brand-monogram\'>B</span>'">
        </div>
        <div class="brand-titles">
          <h1 class="brand-kirtimukha">Baladatta Tamil School</h1>
          <span class="brand-subtamil">Attendance Portal</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="googleLoginBtn" class="sync-button" title="Connect Google Sheets">
          <span class="sync-dot"></span>
          <span id="googleLoginBtnText">Sync Sheets</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation Underline Tabs -->
  <div class="nav-pill-container">
    <nav class="segmented-pill-bar" aria-label="App Navigation">
      <button id="navAttendanceTab" class="nav-pill-btn active">
        <span>Attendance</span>
      </button>
      <button id="navDashboardTab" class="nav-pill-btn">
        <span>Analytics</span>
      </button>
    </nav>
  </div>

  <!-- Main Content Container -->
  <main class="main-wrapper">

    <!-- Inner Editorial Sheet with Rich Backdrop Contrast -->
    <div class="editorial-sheet">

      <!-- ATTENDANCE VIEW -->
      <section id="attendanceViewSection">
        
        <!-- Nilai Level Selector -->
        <div class="level-scroll-section">
          <div id="levelPillsRow" class="level-pills-row">
            <!-- Populated dynamically via JS -->
          </div>
        </div>

        <!-- Date & Status Toolbar -->
        <div class="toolbar-card">
          <div class="date-controls-group">
            <button id="prevDateBtn" class="icon-btn" title="Previous Day">‹</button>
            <input type="date" id="attendanceDatePicker" class="pill-date-input" aria-label="Attendance Date" />
            <button id="nextDateBtn" class="icon-btn" title="Next Day">›</button>
            <button id="dateTodayBtn" class="btn-today" title="Set to Today">Today</button>
          </div>

          <div>
            <span id="existingDateBadge" class="date-status-badge fresh">Fresh Session</span>
          </div>
        </div>

        <!-- Roster Header & Editorial Mass Actions -->
        <div class="roster-header-row">
          <div class="roster-heading">
            <span>Students Roster</span>
          </div>
          <div class="roster-actions">
            <button id="markAllPresentBtn" class="btn-ghost-action" title="Mark All Present">
              Mark All Present
            </button>
            <span class="action-separator">/</span>
            <button id="markAllAbsentBtn" class="btn-ghost-action" title="Mark All Absent">
              Mark All Absent
            </button>
          </div>
        </div>

        <!-- Student Cards Container -->
        <div id="studentListContainer" class="student-cards-list">
          <!-- Rendered dynamically via App.renderStudentList -->
        </div>

        <!-- Empty State -->
        <div id="emptyStudentState" class="empty-state-box" style="display:none;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="color:var(--terra); margin-bottom:8px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <h3>No students in this class</h3>
          <p style="font-size:0.8125rem;">Add a student below to get started.</p>
        </div>

        <!-- Add Student Bar -->
        <div class="add-student-container">
          <input type="text" id="newStudentInput" class="add-student-input" placeholder="+ Add student full name..." aria-label="Student name" />
          <button id="addStudentBtn" class="btn-primary">
            + Add Student
          </button>
        </div>

      </section>

      <!-- DASHBOARD VIEW -->
      <section id="dashboardViewSection" class="dashboard-section">
        <div id="dashboardContent">
          <!-- Rendered dynamically via Dashboard.render -->
        </div>
      </section>

    </div>

  </main>

  <!-- Sticky Bottom Action Bar -->
  <aside class="sticky-action-bar" id="stickyActionBar">
    <div class="sticky-action-container">
      <div class="tally-group">
        <span class="tally-chip present stat-present-count">0 Present</span>
        <span class="tally-chip absent stat-absent-count">0 Absent</span>
        <span class="tally-chip total stat-total-count">0 Total</span>
      </div>

      <button id="submitAttendanceBtn" class="btn-submit-attendance" title="Save and Sync Attendance">
        <span>Submit Attendance</span>
      </button>
    </div>
  </aside>

  <!-- Reusable Modal Dialog -->
  <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle" class="modal-title">Modal Title</h3>
        <button id="modalCloseIcon" class="btn-icon-subtle" aria-label="Close modal">✕</button>
      </div>
      <div id="modalBody" class="modal-body-area"></div>
      <div class="modal-foot">
        <button id="modalCancelBtn" class="btn-ghost-action" style="padding:8px 16px;">Cancel</button>
        <button id="modalConfirmBtn" class="btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Scripts (Cache Busted v18) -->
  <script src="js/store.js?v=18"></script>
  <script src="js/sheets-api.js?v=18"></script>
  <script src="js/student-mgr.js?v=18"></script>
  <script src="js/dashboard.js?v=18"></script>
  <script src="js/app.js?v=18"></script>
</body>

</html>
