<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baladatta Tamil School Attendance | பாலதத்தா தமிழ்ப்பள்ளி</title>
  <meta name="description" content="Attendance tracking portal for Baladatta Tamil School." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Google Identity Services & GAPI Client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1117">
  <link rel="icon" type="image/png" href="Logo.png">

  <!-- Clean Design System -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <!-- Offline Notice -->
  <div id="offlineBanner" class="offline-banner">
    Offline Mode: Changes saved locally and will sync when reconnected.
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-section">
        <div class="brand-avatar" id="headerAvatar">
          <img src="Logo.png" alt="Baladatta Logo" onerror="this.outerHTML='<span>🏫</span>'">
        </div>
        <div class="brand-text">
          <span class="brand-greeting">Hello, <strong id="teacherDisplay">Teacher</strong></span>
          <h1 class="brand-title">Baladatta Tamil School</h1>
        </div>
      </div>

      <div class="header-actions">
        <button id="googleLoginBtn" class="sync-button" title="Connect Google Sheets">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span id="googleLoginBtnText">Connect Sheets</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Segmented Navigation -->
  <div class="nav-pill-container">
    <nav class="segmented-pill-bar" aria-label="App Navigation">
      <button id="navAttendanceTab" class="nav-pill-btn active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Mark Attendance</span>
      </button>
      <button id="navDashboardTab" class="nav-pill-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span>Analytics Dashboard</span>
      </button>
    </nav>
  </div>

  <!-- Main Container -->
  <main class="main-wrapper">

    <!-- ATTENDANCE VIEW -->
    <section id="attendanceViewSection">
      
      <!-- Nilai Horizontal Selector -->
      <div class="level-scroll-section">
        <div id="levelPillsRow" class="level-pills-row">
          <!-- Populated dynamically via JS -->
        </div>
      </div>

      <!-- Date & Status Toolbar -->
      <div class="toolbar-card">
        <div class="date-controls-group">
          <button id="prevDateBtn" class="icon-btn" title="Previous Day">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <input type="date" id="attendanceDatePicker" class="pill-date-input" aria-label="Attendance Date" />
          <button id="nextDateBtn" class="icon-btn" title="Next Day">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button id="dateTodayBtn" class="btn-today" title="Set to Today">Today</button>
        </div>

        <div>
          <span id="existingDateBadge" class="date-status-badge fresh">● Fresh Session</span>
        </div>
      </div>

      <!-- Roster Header & Quick Mass Actions -->
      <div class="roster-header-row">
        <div class="roster-heading">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--primary);"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          <span>Students Roster</span>
        </div>
        <div class="roster-actions">
          <button id="markAllPresentBtn" class="btn-ghost-action" title="Mark All Present">
            ✓ All Present
          </button>
          <button id="markAllAbsentBtn" class="btn-ghost-action" title="Mark All Absent">
            ✗ All Absent
          </button>
        </div>
      </div>

      <!-- Student Cards Container -->
      <div id="studentListContainer" class="student-cards-list">
        <!-- Rendered dynamically via App.renderStudentList -->
      </div>

      <!-- Empty State -->
      <div id="emptyStudentState" class="empty-state-box" style="display:none;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted); margin-bottom:8px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <h3>No students found in this Nilai</h3>
        <p style="font-size:0.85rem;">Add a student below to get started.</p>
      </div>

      <!-- Add Student Bar -->
      <div class="add-student-container">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--primary);"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <input type="text" id="newStudentInput" class="add-student-input" placeholder="Add student full name..." aria-label="Student name" />
        <button id="addStudentBtn" class="btn-primary">
          + Add Student
        </button>
      </div>

    </section>

    <!-- DASHBOARD VIEW -->
    <section id="dashboardViewSection" class="dashboard-view">
      <div class="roster-header-row" style="margin-bottom: 16px;">
        <div class="roster-heading">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--primary);"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          <span>Attendance Analytics & Reports</span>
        </div>
      </div>

      <div id="dashboardContent">
        <!-- Rendered dynamically via Dashboard.render -->
      </div>
    </section>

  </main>

  <!-- Single Unified Sticky Bottom Action Bar -->
  <aside class="sticky-action-bar" id="stickyActionBar">
    <div class="sticky-action-container">
      <div class="tally-group">
        <span class="tally-chip present stat-present-count">0 Present</span>
        <span class="tally-chip absent stat-absent-count">0 Absent</span>
        <span class="tally-chip total stat-total-count">0 Total</span>
      </div>

      <button id="submitAttendanceBtn" class="btn-submit-attendance" title="Save & Sync Attendance">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        <span>Submit Attendance</span>
      </button>
    </div>
  </aside>

  <!-- Reusable Modal Dialog -->
  <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle" class="modal-title">Modal Title</h3>
        <button id="modalCloseIcon" class="btn-icon-subtle" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modalBody" class="modal-body-area"></div>
      <div class="modal-foot">
        <button id="modalCancelBtn" class="btn-ghost-action" style="padding:8px 16px;">Cancel</button>
        <button id="modalConfirmBtn" class="btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/store.js"></script>
  <script src="js/sheets-api.js"></script>
  <script src="js/student-mgr.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
