<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baladatta Attendance | பாலதத்தா</title>
  <meta name="description" content="Minimalist attendance portal for Baladatta Tamil School." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Google Identity Services & GAPI Client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#161513">
  <link rel="icon" type="image/png" href="Logo.png">

  <!-- Ultra-Minimalist Claude Dark Theme (v6) -->
  <link rel="stylesheet" href="css/styles.css?v=6">
</head>

<body>
  <!-- Offline Notice -->
  <div id="offlineBanner" class="offline-banner">
    Offline — changes saved locally
  </div>

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="nav-inner">
      <div class="brand-group">
        <span class="brand-name">Baladatta</span>
        <span class="brand-sub">தமிழ்ப்பள்ளி</span>
      </div>

      <!-- Segmented View Switcher -->
      <nav class="view-tabs" aria-label="App Navigation">
        <button id="navAttendanceTab" class="view-tab active">Attendance</button>
        <button id="navDashboardTab" class="view-tab">Analytics</button>
      </nav>

      <!-- Sync Status Pill -->
      <button id="googleLoginBtn" class="sync-pill" title="Connect Google Sheets">
        <span class="sync-dot"></span>
        <span id="googleLoginBtnText">Sync Sheets</span>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="app-container">

    <!-- ATTENDANCE VIEW -->
    <section id="attendanceViewSection">
      
      <!-- Date & Quick Actions Toolbar -->
      <div class="control-row">
        <div class="date-bar">
          <button id="prevDateBtn" class="date-step-btn" title="Previous Day">‹</button>
          <input type="date" id="attendanceDatePicker" class="date-native-input" aria-label="Attendance Date" />
          <button id="nextDateBtn" class="date-step-btn" title="Next Day">›</button>
          <button id="dateTodayBtn" class="date-today-link" title="Jump to Today">Today</button>
          <span id="existingDateBadge" class="saved-dot" title="Session Saved"></span>
        </div>

        <div class="quick-actions">
          <button id="markAllPresentBtn" class="action-link" title="Mark All Present">All Present</button>
          <span class="action-divider">/</span>
          <button id="markAllAbsentBtn" class="action-link" title="Mark All Absent">All Absent</button>
        </div>
      </div>

      <!-- Nilai Class Tabs (Clean Underline Style) -->
      <div class="nilai-nav-wrap">
        <div id="levelPillsRow" class="nilai-tabs-list">
          <!-- Populated dynamically via App.populateNilaiControls -->
        </div>
      </div>

      <!-- Student List (Spacious Clean Rows) -->
      <div id="studentListContainer" class="students-list">
        <!-- Rendered dynamically via App.renderStudentList -->
      </div>

      <!-- Empty State -->
      <div id="emptyStudentState" class="empty-placeholder" style="display:none;">
        <p>No students in this class</p>
      </div>

      <!-- Add Student Row (Quiet, inline) -->
      <div class="add-row">
        <input type="text" id="newStudentInput" class="add-inline-input" placeholder="+ Add student full name..." aria-label="New student name" />
        <button id="addStudentBtn" class="add-inline-btn">+ Add</button>
      </div>

    </section>

    <!-- DASHBOARD VIEW -->
    <section id="dashboardViewSection" class="dashboard-section">
      <div id="dashboardContent">
        <!-- Rendered dynamically via Dashboard.render -->
      </div>
    </section>

  </main>

  <!-- Sleek Floating Bottom Action Bar -->
  <footer class="floating-bar" id="stickyActionBar">
    <div class="floating-inner">
      <div class="floating-tally">
        <span class="tally-count stat-present-count">0 Present</span>
        <span class="tally-sep">·</span>
        <span class="tally-count-muted stat-absent-count">0 Absent</span>
      </div>

      <button id="submitAttendanceBtn" class="submit-action-btn" title="Submit Attendance">
        <span>Save Attendance</span>
      </button>
    </div>
  </footer>

  <!-- Reusable Modal Dialog -->
  <div id="modalOverlay" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button id="modalCloseIcon" class="modal-x" aria-label="Close">✕</button>
      </div>
      <div id="modalBody" class="modal-content"></div>
      <div class="modal-actions">
        <button id="modalCancelBtn" class="btn-subtle">Cancel</button>
        <button id="modalConfirmBtn" class="btn-coral-action">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-area" aria-live="polite"></div>

  <!-- Scripts (Cache Busted v6) -->
  <script src="js/store.js?v=6"></script>
  <script src="js/sheets-api.js?v=6"></script>
  <script src="js/student-mgr.js?v=6"></script>
  <script src="js/dashboard.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>

</html>
